# Render Blueprint: one free web service runs the API and serves the built website on the same address, so the
# session cookie stays first-party (D-011). Postgres and files are on Neon (or files on R2), email is Brevo SMTP; their
# values are entered in the Render dashboard (sync: false), never committed. Guide: docs/21-deploy-render.md.
services:
  - type: web
    name: pmcrm
    runtime: node
    plan: free
    region: singapore
    branch: main
    autoDeploy: false # production deploys are manual (docs/04)
    buildCommand: bash scripts/render/build.sh
    startCommand: bash scripts/render/start.sh
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: NODE_ENV
        value: production
      - key: WEB_DIST_DIR
        value: apps/web/dist
      - key: COOKIE_SECURE
        value: 'true'
      - key: SESSION_SECRET
        generateValue: true
      - key: WEB_ORIGIN # this service's own address, e.g. https://pmcrm.onrender.com
        sync: false
      - key: DATABASE_URL # Neon connection string (sslmode=require)
        sync: false
      - key: FX_PROVIDER
        value: frankfurter
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_REGION # Neon: its AWS_REGION, e.g. ap-southeast-1 (R2: auto)
        sync: false
      - key: S3_ENDPOINT # Neon: its AWS_ENDPOINT_URL_S3 (R2: https://<account id>.r2.cloudflarestorage.com)
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: EMAIL_TRANSPORT
        value: smtp
      - key: EMAIL_FROM # e.g. Project Management CRM <you@yourdomain.com> (a sender verified in Brevo)
        sync: false
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: '587'
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
